name: Bagisto SQA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:

      # 1. Download your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install Chrome browser
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      # 4. Install your Python libraries from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Run all your Pytest tests
      - name: Run Selenium Tests
        run: pytest tests/ --html=report.html --self-contained-html -v
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # 6. Save your HTML report so you can download it
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: report.html

      # 7. Save screenshots (especially useful when tests fail)
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: failure-screenshots
          path: screenshots/